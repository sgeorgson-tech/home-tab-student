<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2733; --muted:#5F6875; --line:#E3E6EA;
    --accent:#1E48B8; --ring:#8FB0E0;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start;
    padding:clamp(40px,10vh,96px) 24px 56px;
    background:#F6F7F9;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- background ---------- */
  .bg{position:fixed; inset:0; z-index:-3; background:#F6F7F9;
      background-size:cover; background-position:center;
      opacity:0; transition:opacity 700ms ease;}
  .bg.on{opacity:1;}
  .bg-scrim{position:fixed; inset:0; z-index:-2; pointer-events:none;
      background:linear-gradient(180deg,rgba(12,16,22,.34) 0%,rgba(12,16,22,.10) 30%,rgba(12,16,22,.30) 100%);
      opacity:0; transition:opacity 700ms ease;}
  .bg-scrim.on{opacity:1;}
  body.photo{color:#fff;}

  /* ---------- masthead ---------- */
  .mast{display:flex; flex-direction:column; align-items:center; gap:18px;
        margin-bottom:clamp(30px,5vh,52px);}
  .crest{width:clamp(84px,12vw,116px); height:auto; display:block;
         filter:drop-shadow(0 4px 16px rgba(10,14,20,.30));}
  /* Institutional wordmark: uppercase, letterspaced, quiet.
     Prefer a serif instead? Swap the font-family line for:
        font-family:"Instrument Serif",Georgia,serif;
     and set text-transform:none; letter-spacing:.01em; font-size:24px; */
  .school{
    font-family:"Inter",system-ui,sans-serif; font-weight:600;
    font-size:12.5px; letter-spacing:.17em; text-transform:uppercase;
    margin:0; color:var(--muted); text-align:center;
  }
  body.photo .school{color:rgba(255,255,255,.95); text-shadow:0 1px 10px rgba(8,12,18,.6);}

  /* ---------- search ---------- */
  .search-wrap{width:100%; max-width:580px; margin-bottom:clamp(34px,6vh,54px);}
  .search{
    position:relative;
    display:flex; align-items:center; gap:15px;
    background:#fff; border:1px solid rgba(0,0,0,.05);
    border-radius:28px; padding:0 20px; height:56px;
    box-shadow:0 1px 4px rgba(12,16,22,.09), 0 10px 34px rgba(12,16,22,.10);
    transition:box-shadow 180ms ease, border-radius 180ms ease;
  }
  .search:hover{box-shadow:0 1px 4px rgba(12,16,22,.12), 0 12px 40px rgba(12,16,22,.16);}
  .search:focus-within{box-shadow:0 1px 4px rgba(12,16,22,.12), 0 12px 40px rgba(12,16,22,.18);}
  .search.suggesting{border-radius:28px 28px 0 0; box-shadow:0 1px 4px rgba(12,16,22,.12);}
  .search .g{flex:0 0 auto; display:flex;}
  .search input{
    flex:1 1 auto; border:0; outline:0; background:transparent;
    font:inherit; font-size:16px; font-weight:400; color:var(--ink); height:100%;
    letter-spacing:.002em;
  }
  .search input::placeholder{color:#9AA2AE;}
  .search .go{
    flex:0 0 auto; border:0; background:transparent; padding:0;
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease;
  }
  .search .go:hover{background:rgba(31,39,51,.06);}
  .search .go:focus-visible{outline:none; box-shadow:0 0 0 2px var(--ring);}
  .search .go svg{width:19px; height:19px; fill:none; stroke:var(--muted); stroke-width:2.1;
    stroke-linecap:round; stroke-linejoin:round;}

  /* app suggestions -- from YOUR tiles only, never the open web */
  .suggest{
    position:absolute; top:100%; left:0; right:0;
    background:#fff; border-radius:0 0 20px 20px;
    box-shadow:0 12px 34px rgba(12,16,22,.16);
    padding:6px 0 10px; display:none; z-index:30;
    border-top:1px solid var(--line);
  }
  .suggest.open{display:block;}
  .sg-item{
    display:flex; align-items:center; gap:13px;
    padding:9px 20px; cursor:pointer; transition:background 110ms ease;
  }
  .sg-item:hover,.sg-item.active{background:rgba(31,39,51,.055);}
  .sg-item img{width:26px; height:26px; border-radius:7px; flex:0 0 auto;}
  .sg-name{font-size:14.5px; font-weight:500; color:var(--ink);}
  .sg-sub{font-size:12px; color:var(--muted); margin-left:auto;}

  /* ---------- shortcut grid ---------- */
  .board{
    width:100%; max-width:640px;
    display:grid; grid-template-columns:repeat(6,1fr);
    gap:10px 2px;
  }
  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:14px 4px 12px; border-radius:14px;
    transition:background 140ms ease;
  }
  .tile:hover{background:rgba(255,255,255,.16);}
  body:not(.photo) .tile:hover{background:rgba(31,39,51,.05);}
  .tile:focus-visible{outline:none; background:rgba(255,255,255,.26);
    box-shadow:0 0 0 2px var(--ring);}
  .badge{
    width:54px; height:54px; flex:0 0 auto;
    border-radius:15px; overflow:hidden;
    box-shadow:0 1px 2px rgba(10,14,20,.10), 0 3px 10px rgba(10,14,20,.13);
    transition:transform 160ms cubic-bezier(.2,.8,.3,1);
  }
  .tile:hover .badge{transform:translateY(-2px) scale(1.04);}
  .badge img{width:100%; height:100%; display:block; object-fit:cover;}
  .label{
    font-size:11.5px; font-weight:500; line-height:1.3;
    text-align:center; color:var(--ink); max-width:90px;
    letter-spacing:.008em;
  }
  body.photo .label{color:#fff; text-shadow:0 1px 6px rgba(8,12,18,.7);}

  /* hover info overlay */
  .tip{
    position:absolute; bottom:calc(100% - 2px); left:50%;
    transform:translate(-50%,4px);
    background:rgba(24,30,40,.96); color:#fff;
    font-size:11px; font-weight:500; letter-spacing:.01em;
    padding:6px 11px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; text-shadow:none;
    transition:opacity 150ms ease, transform 150ms ease;
    z-index:5;
  }
  .tip::after{content:""; position:absolute; top:100%; left:50%;
    transform:translateX(-50%); border:5px solid transparent;
    border-top-color:rgba(24,30,40,.96);}
  .tile:hover .tip,.tile:focus-visible .tip{opacity:1; transform:translate(-50%,0);}

  /* ---------- waffle ---------- */
  /* ---- top bar: Images link, waffle, account (pinned top-right) ---- */
  .topbar{
    position:fixed; top:20px; right:20px; z-index:20;
    display:flex; align-items:center; gap:6px;
  }
  .topbar .tlink{
    font-size:13px; font-weight:500; letter-spacing:.005em;
    padding:8px 14px; border-radius:999px; white-space:nowrap;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.95);
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .topbar .tlink:hover{
    background:rgba(255,255,255,.4);
    border-color:rgba(95,104,117,.8); color:#3D4552;
  }
  .topbar .tlink:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  body.photo .topbar .tlink{
    border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.95);
  }
  body.photo .topbar .tlink:hover{
    background:rgba(255,255,255,.2); border-color:#fff; color:#fff;
  }
  /* outlined avatar: gray rim, gray glyph, transparent interior */
  .acct{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.85);
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .acct:hover{
    background:rgba(255,255,255,.4);
    border-color:rgba(95,104,117,.8);
    color:#3D4552;
  }
  .acct:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  .acct svg{width:19px; height:19px; display:block;}
  /* over a photo, switch the rim and glyph to white so it stays legible */
  body.photo .acct{
    border-color:rgba(255,255,255,.75);
    color:rgba(255,255,255,.92);
  }
  body.photo .acct:hover{
    background:rgba(255,255,255,.2);
    border-color:#fff; color:#fff;
  }

  .waffle-wrap{position:relative; z-index:20;}
  .waffle-btn{
    width:38px; height:38px; border-radius:50%;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.9);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .waffle-btn:hover{
    background:rgba(255,255,255,.4);
    border-color:rgba(95,104,117,.8); color:#3D4552;
  }
  body.photo .waffle-btn{
    border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.92);
  }
  body.photo .waffle-btn:hover{
    background:rgba(255,255,255,.2); border-color:#fff; color:#fff;
  }
  .waffle-btn:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  .waffle-dots{display:grid; grid-template-columns:repeat(3,3.6px); gap:2.8px;}
  .waffle-dots span{width:3.6px; height:3.6px; border-radius:50%; background:currentColor;}
  .waffle-panel{
    position:absolute; top:50px; right:0;
    background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:12px; box-shadow:0 14px 40px rgba(10,14,20,.20);
    display:none; grid-template-columns:repeat(3,72px); gap:2px;
  }
  .waffle-panel.open{display:grid;}
  .waffle-item{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:11px 4px; border-radius:12px; transition:background 120ms ease;
  }
  .waffle-item:hover{background:rgba(31,39,51,.05);}
  .waffle-item img{width:26px; height:26px; display:block;}
  .waffle-item span{font-size:10.5px; font-weight:500; color:var(--muted);}

  .foot{
    margin-top:30px; font-size:11.5px; font-weight:400;
    color:var(--muted); letter-spacing:.02em;
  }

  /* ---- weather widget (top-left) ---- */
  .weather{
    position:fixed; top:20px; left:22px; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:9px 16px 9px 14px; border-radius:18px;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 2px 10px rgba(10,14,20,.16);
  }
  .wx-date{display:flex; flex-direction:column; line-height:1.18;}
  .wx-time{font-size:17px; font-weight:600; color:var(--ink); letter-spacing:-.02em;}
  .wx-day{font-size:11px; font-weight:500; color:var(--muted);}
  .weather{text-decoration:none;}
  .weather:hover{background:rgba(255,255,255,.94);}
  .wx-sep{width:1px; height:26px; background:rgba(31,39,51,.12); display:none;}
  .wx-sep.on{display:block;}
  .wx-block{display:none; align-items:center; gap:9px;}
  .wx-block.on{display:flex;}
  .wx-ico{font-size:21px; line-height:1;}
  .wx-t{font-size:16px; font-weight:600; color:var(--ink); letter-spacing:-.01em; line-height:1.15;}
  .wx-d{font-size:10.5px; font-weight:500; color:var(--muted); line-height:1.2;}

  /* ---- announcement strip ---- */
  .announce{
    display:none; align-items:center; gap:11px;
    max-width:600px; margin:0 0 22px;
    padding:11px 18px 11px 15px; border-radius:14px;
    background:rgba(255,255,255,.88);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:0 2px 12px rgba(10,14,20,.14);
    border-left:3px solid var(--accent);
  }
  .announce.on{display:flex;}
  .announce .an-dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    flex:0 0 auto;
  }
  .announce .an-tx{
    font-size:13.5px; font-weight:500; color:var(--ink); line-height:1.4;
  }

  /* ---- background customize control (bottom-right) ---- */
  .cust-wrap{position:fixed; bottom:20px; right:20px; z-index:25; display:none;}
  .cust-wrap.on{display:block;}
  .cust-btn{
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.9);
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .cust-btn:hover{
    background:rgba(255,255,255,.4);
    border-color:rgba(95,104,117,.8); color:#3D4552;
  }
  .cust-btn:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  .cust-btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;}
  body.photo .cust-btn{
    border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.92);
  }
  body.photo .cust-btn:hover{
    background:rgba(255,255,255,.2); border-color:#fff; color:#fff;
  }
  .cust-panel{
    position:absolute; bottom:50px; right:0; width:216px;
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:7px; box-shadow:0 14px 40px rgba(10,14,20,.20);
    display:none;
  }
  .cust-panel.open{display:block;}
  .cust-head{
    font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
    color:var(--muted); padding:7px 11px 8px;
  }
  .cust-opt{
    display:flex; align-items:center; gap:10px; width:100%;
    border:0; background:transparent; text-align:left; cursor:pointer;
    font:inherit; font-size:13.5px; color:var(--ink);
    padding:9px 11px; border-radius:10px;
    transition:background 110ms ease;
  }
  .cust-opt:hover{background:rgba(31,39,51,.055);}
  .cust-opt .chk{
    width:16px; height:16px; flex:0 0 auto; border-radius:50%;
    border:1.8px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .cust-opt.sel .chk{border-color:var(--accent); background:var(--accent);}
  .cust-opt.sel .chk::after{content:""; width:5px; height:5px; border-radius:50%; background:#fff;}
  .cust-rule{height:1px; background:var(--line); margin:6px 11px;}

  /* waffle icon fallback when a favicon can't load */
  .wfallback{
    width:26px; height:26px; border-radius:7px; display:flex;
    align-items:center; justify-content:center; color:#fff;
    font-size:12px; font-weight:700; font-family:"Inter",sans-serif;
  }

  /* ---- mic / lens buttons in the search bar ---- */
  .search .tool{
    flex:0 0 auto; border:0; background:transparent; padding:0;
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease;
  }
  .search .tool:hover{background:rgba(31,39,51,.06);}
  .search .tool:focus-visible{outline:none; box-shadow:0 0 0 2px var(--ring);}
  .search .tool svg{width:19px; height:19px;}
  .search .tool.listening{background:rgba(234,67,53,.12);}
  .search .tool.listening svg{fill:#EA4335;}
  .divider{width:1px; height:22px; background:var(--line); flex:0 0 auto;}
  body.photo .foot{color:rgba(255,255,255,.9); text-shadow:0 1px 8px rgba(8,12,18,.6);}

  /* on narrower windows the fixed corner controls would run into the
     centered crest, so give the content room to clear them */
  @media (max-width:760px){
    body{padding-top:96px;}
    .topbar{top:14px; right:14px; gap:4px;}
    .topbar .tlink{font-size:12px; padding:6px 10px;}
    .weather{top:14px; left:14px; padding:7px 12px 7px 11px;}
    .wx-time{font-size:15px;}
  }
  @media (max-width:560px){
    body{padding-top:110px;}
    .topbar .tlink{display:none;}   /* Images link folds away; waffle + account remain */
  }
  @media (max-width:620px){ .board{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:400px){ .board{grid-template-columns:repeat(3,1fr);} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

  <a class="weather" id="weather" href="https://forecast.weather.gov/MapClick.php?lat=42.9111&amp;lon=-88.1287" aria-label="Time, date, and local forecast">
    <span class="wx-date">
      <span class="wx-time" id="wxTime"></span>
      <span class="wx-day" id="wxDay"></span>
    </span>
    <span class="wx-sep" id="wxSep"></span>
    <span class="wx-block" id="wxBlock">
      <span class="wx-ico" id="wxIco"></span>
      <span><span class="wx-t" id="wxT"></span><br><span class="wx-d" id="wxD"></span></span>
    </span>
  </a>

  <div class="bg" id="bg"></div>
  <div class="bg-scrim" id="scrim"></div>

  <div class="topbar">
    <a class="tlink" href="https://www.google.com/imghp?safe=active">Images</a>
    <div class="waffle-wrap">
    <button class="waffle-btn" id="waffleBtn" aria-label="Google apps" aria-expanded="false">
      <span class="waffle-dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
    </button>
    <div class="waffle-panel" id="wafflePanel" role="menu"></div>
    </div>
    <a class="acct" href="https://myaccount.google.com" aria-label="Your Google account" title="Your account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="9.2" r="3.3"/><path d="M5.8 19.6a6.4 6.4 0 0 1 12.4 0"/></svg>
    </a>
  </div>

  <div class="mast">
    <img class="crest" id="crest" alt="St. Paul's Lutheran School, Muskego"
         src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E">
    <p class="school">St. Paul&#8217;s Lutheran &middot; Muskego</p>
  </div>

  <div class="announce" id="announce">
    <span class="an-dot"></span>
    <span class="an-tx" id="announceText"></span>
  </div>

  <div class="search-wrap">
    <form class="search" action="https://www.google.com/search" method="GET" role="search" aria-label="Search Google">
      <span class="g" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 48 48">
          <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
          <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
          <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
        </svg>
      </span>
      <input type="text" name="q" id="q" placeholder="Search Google or find an app" autocomplete="off" spellcheck="false" aria-label="Search terms" autofocus>
      <input type="hidden" name="safe" value="active">
      <button type="button" class="tool" id="micBtn" aria-label="Search by voice" title="Search by voice">
        <svg viewBox="0 0 24 24" fill="#5F6875"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M18 11a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.9V20h2v-3.1A6 6 0 0 0 18 11z"/></svg>
      </button>
      <a class="tool" href="https://lens.google.com" aria-label="Search with an image" title="Search with an image">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5F6875" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 1 2-2h2l1.5-2h7L17 7h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg>
      </a>
      <span class="divider"></span>
      <button type="submit" class="go" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <div class="suggest" id="suggest" role="listbox"></div>
    </form>
  </div>

  <main class="board" id="board"></main>

  document.getElementById("crest").src = CREST;

  /* ---- shortcut grid ---- */
  const board = document.getElementById("board");
  TILES.forEach(t => {
    const a = document.createElement("a");
    a.className = "tile"; a.href = t.url; a.setAttribute("aria-label", t.name);

    const badge = document.createElement("span"); badge.className = "badge";
    const img = document.createElement("img"); img.alt = ""; img.src = ICONS[t.icon];
    badge.appendChild(img);

    const label = document.createElement("span");
    label.className = "label"; label.textContent = t.name;

    a.append(badge, label);
    if (t.sub) {
      const tip = document.createElement("span");
      tip.className = "tip"; tip.textContent = t.sub;
      a.appendChild(tip);
    }
    board.appendChild(a);
  });

  /* ---- date ---- */
  /* ---- clock + date, top-left (always shown, even offline) ---- */
  (function(){
    function tick(){
      const d = new Date();
      document.getElementById("wxTime").textContent =
        d.toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
      document.getElementById("wxDay").textContent =
        d.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
    }
    tick();
    setInterval(tick, 15000);
  })();

  /* ---- daily background photo -------------------------------
     A curated set YOU choose, living in a "bg" folder next to this
     page. One photo per day, rotating through the whole set, then
     starting over. Nothing is fetched from the internet.

     SETUP: make a folder named  bg  and put your photos in it,
     numbered with two digits:

         bg/01.jpg   bg/02.jpg   bg/03.jpg   ...

     Then set BG_COUNT below to how many you have. That's the only
     number to change. Twenty photos gives you about a month before
     one repeats; thirty gives you six weeks.

     Photos should be landscape, at least 1920 wide, saved as .jpg.
     If a photo is missing or BG_COUNT is 0, the page just shows its
     clean light background -- it never looks broken.
     ------------------------------------------------------------ */

  const PLAIN = { white:"#FFFFFF", gray:"#F1F3F4" };

    const btn   = document.getElementById("custBtn");
    const panel = document.getElementById("custPanel");
    const bgEl  = document.getElementById("bg");
    const scrim = document.getElementById("scrim");
    const photoOpts = document.getElementById("photoOpts");

    /* the control is always available -- White/Gray work with or
       without photos. The two photo choices only appear once you've
       added a bg/ folder and set BG_COUNT. */
    wrap.classList.add("on");
    const hasPhotos = BG_COUNT >= 1;
    if (!hasPhotos) photoOpts.style.display = "none";

    function pref(){
      try{
        const p = JSON.parse(localStorage.getItem("bgPref")||"null");
        if (p && p.mode) {
          /* if photos went away, fall back to a plain mode */
          if (!hasPhotos && (p.mode==="rotate" || p.mode==="lock")) return {mode:"white"};
          return p;
        }
      }catch(e){}
      return { mode: hasPhotos ? "rotate" : "white" };
    }
    function save(p){ try{ localStorage.setItem("bgPref", JSON.stringify(p)); }catch(e){} }

    function todaysNumber(){
      const now=new Date(), start=new Date(now.getFullYear(),0,0);
      return (Math.floor((now-start)/86400000) % BG_COUNT) + 1;
    }
    function fileFor(n){ return "bg/"+String(n).padStart(2,"0")+"."+BG_EXT; }

    function goPlain(hex){
      bgEl.classList.remove("on"); scrim.classList.remove("on");
      document.body.classList.remove("photo");
      document.body.style.background = hex;
      bgEl.style.background = hex;
    }

    function paint(){
      const p = pref();
      if (p.mode === "white" || p.mode === "gray"){
        goPlain(PLAIN[p.mode]); mark(); return;
      }
      const n = (p.mode === "lock" && p.n) ? p.n : todaysNumber();
      const url = fileFor(n);
      const pre = new Image();
      pre.onload = function(){
        bgEl.style.backgroundImage = "url('"+url+"')";
        bgEl.classList.add("on"); scrim.classList.add("on");
        document.body.classList.add("photo");
      };
      pre.onerror = function(){ goPlain(PLAIN.white); };
      pre.src = url;
      mark();
    }
    function mark(){
      const m = pref().mode;
      panel.querySelectorAll(".cust-opt").forEach(b =>
        b.classList.toggle("sel", b.dataset.mode === m));
    }

    panel.querySelectorAll(".cust-opt").forEach(b => {
      b.addEventListener("click", e => {
        e.stopPropagation();
        const mode = b.dataset.mode;
        if (mode === "lock"){
          /* pins whatever photo is showing right now */
          const cur = pref();
          const n = (cur.mode === "lock" && cur.n) ? cur.n : todaysNumber();
          save({mode:"lock", n:n});
        } else {
          save({mode:mode});
        }
        paint();
      });
    });

    btn.addEventListener("click", e => {
      e.stopPropagation();
      const open = panel.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", () => {
      panel.classList.remove("open");
      btn.setAttribute("aria-expanded","false");
    });

    paint();
  })();



  /* ---- app suggestions ------------------------------------------
     As you type, this matches against YOUR tiles only. It never
     contacts Google's suggestion service, so nothing from the open
     web can ever appear here. Enter still runs a normal Google
     search unless you arrow down onto an app first. */
  (function(){
    const input = document.getElementById("q");
    const box   = document.getElementById("suggest");
    const bar   = document.querySelector(".search");
    let matches = [], active = -1;

    function close(){
      box.classList.remove("open"); bar.classList.remove("suggesting");
      matches = []; active = -1;
    }
    function render(){
      box.innerHTML = "";
      matches.forEach((t,i) => {
        const row = document.createElement("div");
        row.className = "sg-item" + (i===active ? " active" : "");
        row.setAttribute("role","option");
        row.innerHTML = '<img src="'+ICONS[t.icon]+'" alt="">'
                      + '<span class="sg-name"></span>'
                      + '<span class="sg-sub"></span>';
        row.querySelector(".sg-name").textContent = t.name;
        row.querySelector(".sg-sub").textContent  = t.sub || "";
        row.addEventListener("mousedown", e => { e.preventDefault(); window.location.href = t.url; });
        box.appendChild(row);
      });
      box.classList.add("open"); bar.classList.add("suggesting");
    }
    input.addEventListener("input", () => {
      const v = input.value.trim().toLowerCase();
      if (v.length < 1){ close(); return; }
      matches = TILES.filter(t => t.name.toLowerCase().includes(v)).slice(0,4);
      active = -1;
      if (matches.length) render(); else close();
    });
    input.addEventListener("keydown", e => {
      if (!matches.length) return;
      if (e.key === "ArrowDown"){ e.preventDefault(); active = (active+1) % matches.length; render(); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); active = (active-1+matches.length) % matches.length; render(); }
      else if (e.key === "Enter" && active >= 0){ e.preventDefault(); window.location.href = matches[active].url; }
      else if (e.key === "Escape"){ close(); }
    });
    input.addEventListener("blur", () => setTimeout(close,120));
  })();

  /* ---- weather -------------------------------------------------
     Open-Meteo: no API key, no account, free for educational use.
     Coordinates below are Muskego, WI -- change them if you ever
     want a different location. Results are cached for 30 minutes so
     a student opening 40 tabs a day only triggers a couple of calls. */
  const WX_LAT = 42.9111, WX_LON = -88.1287;

  (function(){
    const CODES = {
      0:["\u2600\uFE0F","Clear"], 1:["\u{1F324}\uFE0F","Mostly clear"], 2:["\u26C5","Partly cloudy"],
      3:["\u2601\uFE0F","Cloudy"], 45:["\u{1F32B}\uFE0F","Fog"], 48:["\u{1F32B}\uFE0F","Fog"],
      51:["\u{1F327}\uFE0F","Light drizzle"], 53:["\u{1F327}\uFE0F","Drizzle"], 55:["\u{1F327}\uFE0F","Drizzle"],
      61:["\u{1F327}\uFE0F","Light rain"], 63:["\u{1F327}\uFE0F","Rain"], 65:["\u{1F327}\uFE0F","Heavy rain"],
      66:["\u{1F328}\uFE0F","Freezing rain"], 67:["\u{1F328}\uFE0F","Freezing rain"],
      71:["\u{1F328}\uFE0F","Light snow"], 73:["\u{1F328}\uFE0F","Snow"], 75:["\u2744\uFE0F","Heavy snow"],
      77:["\u2744\uFE0F","Snow grains"], 80:["\u{1F326}\uFE0F","Showers"], 81:["\u{1F326}\uFE0F","Showers"],
      82:["\u{1F326}\uFE0F","Heavy showers"], 85:["\u{1F328}\uFE0F","Snow showers"], 86:["\u{1F328}\uFE0F","Snow showers"],
      95:["\u26C8\uFE0F","Thunderstorm"], 96:["\u26C8\uFE0F","Thunderstorm"], 99:["\u26C8\uFE0F","Thunderstorm"]
    };
    function show(temp, code, hi, lo){
      const c = CODES[code] || ["\u{1F321}\uFE0F",""];
      document.getElementById("wxIco").textContent = c[0];
      document.getElementById("wxT").textContent = Math.round(temp)+"\u00B0F";
      document.getElementById("wxD").textContent =
        c[1] + (hi!=null ? "  \u00B7  H "+Math.round(hi)+"\u00B0 L "+Math.round(lo)+"\u00B0" : "");
      document.getElementById("wxBlock").classList.add("on");
      document.getElementById("wxSep").classList.add("on");
    }
    // try cache first (works once hosted; harmless if storage is unavailable)
    try{
      const c = JSON.parse(localStorage.getItem("wx")||"null");
      if (c && Date.now()-c.at < 1800000){ show(c.t,c.c,c.hi,c.lo); return; }
    }catch(e){}

    const url = "https://api.open-meteo.com/v1/forecast?latitude="+WX_LAT+"&longitude="+WX_LON+
                "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min"+
                "&temperature_unit=fahrenheit&timezone=auto&forecast_days=1";
    fetch(url).then(r=>r.json()).then(d=>{
      const t=d.current.temperature_2m, c=d.current.weather_code;
      const hi=d.daily.temperature_2m_max[0], lo=d.daily.temperature_2m_min[0];
      show(t,c,hi,lo);
      try{ localStorage.setItem("wx", JSON.stringify({t:t,c:c,hi:hi,lo:lo,at:Date.now()})); }catch(e){}
    }).catch(()=>{ /* offline: widget simply stays hidden */ });
  })();

  /* ---- voice search --------------------------------------------
     Uses the browser's built-in speech recognition (same thing that
     powers Chrome's mic button). The first time a student taps it,
     Chrome asks for microphone permission -- you can pre-approve
     this for the student OU in the Admin console so they never see
     the prompt. If the browser doesn't support it, the button hides. */
  (function(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const btn = document.getElementById("micBtn");
    if(!SR){ btn.style.display="none"; return; }
    const rec = new SR();
    rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1;
    let on=false;
    btn.addEventListener("click", ()=>{
      if(on){ rec.stop(); return; }
      try{ rec.start(); on=true; btn.classList.add("listening"); }catch(e){}
    });
    rec.onresult = e => {
      const said = e.results[0][0].transcript;
      const input=document.getElementById("q");
      input.value = said;
      document.querySelector(".search").submit();
    };
    rec.onend = ()=>{ on=false; btn.classList.remove("listening"); };
    rec.onerror = ()=>{ on=false; btn.classList.remove("listening"); };
  })();

  /* ---- announcements, fed by a Google Sheet -----------------------
     SETUP (one time):
       1. Make a Google Sheet with three columns in row 1:
             Message | Start | End
       2. Fill rows underneath. Examples:
             Chapel is at 10:30 today    | 2026-08-18       |
             Book fair all week!         | 2026-08-24       | 2026-08-28
          Start  = the day (or day and time) it begins showing.
                   Format: 2026-08-18   or   2026-08-18 08:00
          End    = optional last day it shows. Leave blank for
                   a single-day notice.
       3. File > Share > Publish to web > choose the sheet,
          pick "Comma-separated values (.csv)", click Publish.
       4. Paste that published URL into SHEET_CSV below.

     HOW IT EXPIRES (automatic, no cleanup needed):
       - No End date  -> disappears 12 hours after Start.
       - With End date -> shows through End, then disappears 12 hours
                          after that day closes (so it is gone by noon
                          the following day).
       Expired rows can sit in the Sheet forever; they never show.
       When nothing is active, the strip is completely invisible.

     Leave SHEET_CSV empty and the whole feature stays off. */
  const SHEET_CSV = "";

  (function(){
    if (!SHEET_CSV) return;

    /* CSV parser that respects quoted fields containing commas */
    function parseCSV(text){
      const rows=[]; let row=[], val="", q=false;
      for (let i=0;i<text.length;i++){
        const c=text[i];
        if (q){
          if (c === '"'){ if (text[i+1] === '"'){ val+='"'; i++; } else q=false; }
          else val+=c;
        } else {
          if (c === '"') q=true;
          else if (c === ","){ row.push(val); val=""; }
          else if (c === "\n"){ row.push(val); rows.push(row); row=[]; val=""; }
          else if (c !== "\r") val+=c;
        }
      }
      if (val.length || row.length){ row.push(val); rows.push(row); }
      return rows;
    }

    function parseDate(s){
      s=(s||"").trim(); if(!s) return null;
      const d=new Date(s.replace(" ","T"));
      return isNaN(d) ? null : d;
    }

    const TWELVE_HOURS = 12*60*60*1000;

    fetch(SHEET_CSV).then(r=>r.text()).then(txt=>{
      const rows=parseCSV(txt);
      if (rows.length < 2) return;
      const now=Date.now();

      for (let i=1;i<rows.length;i++){
        const msg=(rows[i][0]||"").trim();
        if(!msg) continue;
        const start=parseDate(rows[i][1]);
        if(!start) continue;
        const endRaw=parseDate(rows[i][2]);

        /* expiry: 12h after the End day closes, or 12h after Start */
        let expiry;
        if (endRaw){
          const close=new Date(endRaw); close.setHours(23,59,59,999);
          expiry = close.getTime() + TWELVE_HOURS;
        } else {
          expiry = start.getTime() + TWELVE_HOURS;
        }

        if (now >= start.getTime() && now < expiry){
          document.getElementById("announceText").textContent = msg;
          document.getElementById("announce").classList.add("on");
          return;   /* show the first active one only */
        }
      }
    }).catch(()=>{ /* unreachable Sheet: strip stays hidden */ });
  })();

  /* ---- press "/" to jump to the search box ---- */
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== document.getElementById("q")){
      e.preventDefault(); document.getElementById("q").focus();
    }
  });

  /* ---- Google apps switcher ---- */
  const WAFFLE_APPS = [
    { name:"Docs",     url:"https://docs.google.com",      domain:"docs.google.com",      color:"#4285F4" },
    { name:"Slides",   url:"https://slides.google.com",    domain:"slides.google.com",    color:"#F4B400" },
    { name:"Sheets",   url:"https://sheets.google.com",    domain:"sheets.google.com",    color:"#0F9D58" },
    { name:"Forms",    url:"https://forms.google.com",     domain:"forms.google.com",     color:"#7248B9" },
    { name:"Calendar", url:"https://calendar.google.com",  domain:"calendar.google.com",  color:"#4285F4" },
    { name:"Vids",     url:"https://vids.google.com",      domain:"vids.google.com",      color:"#4285F4" },
    { name:"Drawings", url:"https://docs.google.com/drawings", domain:"docs.google.com",   color:"#EA4335" },
    { name:"Earth",    url:"https://earth.google.com",     domain:"earth.google.com",     color:"#0F9D58" },
    { name:"Maps",     url:"https://maps.google.com",      domain:"maps.google.com",      color:"#EA4335" }
  ];
  const wpanel = document.getElementById("wafflePanel");
  WAFFLE_APPS.forEach(app => {
    const it = document.createElement("a");
    it.className = "waffle-item"; it.href = app.url; it.setAttribute("role","menuitem");
    const ico = document.createElement("img"); ico.alt = ""; ico.loading = "lazy";
    ico.src = "https://www.google.com/s2/favicons?domain="+app.domain+"&sz=64";
    ico.onerror = function(){
      const f = document.createElement("span");
      f.className = "wfallback";
      f.style.background = app.color;
      f.textContent = app.name.charAt(0);
      ico.replaceWith(f);
    };
    const nm = document.createElement("span"); nm.textContent = app.name;
    it.append(ico, nm);
    wpanel.appendChild(it);
  });
  const wbtn = document.getElementById("waffleBtn");
  wbtn.addEventListener("click", e => {
    e.stopPropagation();
    const open = wpanel.classList.toggle("open");
    wbtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", () => {
    wpanel.classList.remove("open");
    wbtn.setAttribute("aria-expanded","false");
  });
</script>
